<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Lovel – Spotify</title>
</head>
<body style="font-family: system-ui, sans-serif; background: #E0E5E7; color: #803D25; text-align: center; padding-top: 30vh;">
  <p>Zurück zu Lovel …</p>
  <script>
    // Rücksprung vom Spotify-Login: Ergebnis kurz ablegen und zurück in die
    // App. Eigene Seite, damit der ?code= nicht mit dem Supabase-Login
    // kollidiert. Die App liest und löscht den Eintrag sofort.
    (function () {
      var p = new URLSearchParams(window.location.search);
      var result = { code: p.get('code'), state: p.get('state'), error: p.get('error') };
      try {
        localStorage.setItem('lovel.spotify.result', JSON.stringify(result));
      } catch (e) {}
      window.location.replace('./#/profile/music');
    })();
  </script>
</body>
</html>
