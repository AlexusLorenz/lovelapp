name: Web-Vorschau

# Baut die App für den Browser und veröffentlicht sie auf GitHub Pages:
#   /lovelapp/      Demo-Modus mit Beispieldaten, ohne Backend
#   /lovelapp/app/  echte Datenbank, Anmeldung nur mit Einladung
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Web-Build Demo (ohne Backend)
        run: flutter build web --release --no-web-resources-cdn --base-href /${{ github.event.repository.name }}/ --output ${{ github.workspace }}/build/demo
      - name: Web-Build App (echte Datenbank, nur mit Einladung)
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href /${{ github.event.repository.name }}/app/
          --dart-define-from-file=config/supabase.json
          --dart-define=INVITE_ONLY=true
          --output ${{ github.workspace }}/build/app
      - name: Zusammenführen
        run: |
          mkdir -p build/site
          cp -r build/demo/. build/site/
          cp -r build/app build/site/app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
